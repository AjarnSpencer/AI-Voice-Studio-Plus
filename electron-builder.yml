appId: com.ajarnspencer.textnarratorpolyglotpro
productName: Text Narrator Polyglot Pro
copyright: Copyright © 2026 Ajarn Spencer Littlewood

directories:
  output: release
  buildResources: assets

files:
  - dist/**/*
  - electron.cjs
  - preload.cjs
  - package.json

fileAssociations:
  - ext: aivoice
    name: Polyglot Pro Profile
    description: Professional Vocal Identity Profile
    role: Editor
  - ext: vscript
    name: Polyglot Pro Script
    description: SSML Narrator Script
    role: Editor

# Windows Configuration
win:
  publisherName: Ajarn Spencer Littlewood
  target:
    - target: nsis
      arch: [x64]
  icon: assets/icon.ico
  legalCopyright: Copyright © 2026 Ajarn Spencer Littlewood

# Mac Configuration
mac:
  target:
    - dmg
    - zip
  category: public.app-category.video
  icon: assets/icon.icns
  bundleVersion: 1.7.0

# Linux Configuration
linux:
  target:
    - AppImage
    - deb
    - rpm
    - snap
  category: AudioVideo;Recorder;Audio;
  icon: assets/icon.png
  maintainer: Ajarn Spencer Littlewood <https://github.com/AjarnSpencer>
  vendor: Ajarn Spencer Littlewood
  homepage: https://www.ajarnspencer.com

publish:
  provider: github
  owner: AjarnSpencer
  repo: Text-Narrator-Polyglot-Pro
